<header class="topbar">
    <div class="container-fluid app-shell">
        <div class="brand-wrapper">
            <h1 class="app-title">Reuniones Teams [Issatec]</h1>
            <p class="app-subtitle">Seguimiento inteligente de reuniones y casos</p>
        </div>
        <button type="button" class="btn btn-theme" (click)="toggleTheme()"
            [attr.aria-label]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
            <span>{{ isDarkMode ? 'Modo Claro' : 'Modo Oscuro' }}</span>
        </button>
    </div>
</header>
<main class="container-fluid px-3 px-md-4 py-3 py-md-4">
    <app-calendar></app-calendar>
</main>
